<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>DOPA Analyzer</title><style>body{margin:0;background:#0b1220;color:#e8eefb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:760px;margin:auto;padding:20px}h1{margin-bottom:4px}.muted,small{color:#9eabc2}.card{background:#172237;border:1px solid #293954;border-radius:16px;padding:18px;margin:14px 0}label{display:block;margin:12px 0 4px;color:#cbd5e1}input{width:100%;box-sizing:border-box;background:#0e1727;border:1px solid #3a4c67;border-radius:9px;padding:12px;color:white;font-size:17px}button{border:0;background:#60a5fa;color:#091221;border-radius:10px;padding:12px 16px;font-weight:700;margin:4px 5px 4px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#101a2b;border-radius:12px;padding:12px}.stat strong{display:block;font-size:22px;margin-top:6px;overflow-wrap:anywhere}.bar{height:14px;background:#34445c;border-radius:12px;overflow:hidden}.bar i{display:block;height:100%;background:#60a5fa}.warn{color:#fbbf24}.good{color:#86efac}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}select{padding:10px;background:#0e1727;color:white;border:1px solid #3a4c67;border-radius:9px;width:100%}@media(max-width:400px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>🎴 DOPA Analyzer</h1><div class="muted">iPhone 盲抽分析面板 · V1.0</div><section class="card"><h2>① 卡池資料</h2><label>卡池名稱</label><input id="name" value="皮卡丘超萌變裝大賞"><div class="grid"><div><label>總抽數</label><input id="total" type="number" min="1" value="90000"></div><div><label>剩餘抽數</label><input id="remaining" type="number" min="0" value="90000"></div><div><label>每抽點數</label><input id="cost" type="number" min="0" value="1111"></div><div><label>公告總回報率 %</label><input id="roi" type="number" step=".01" value="102.11"></div></div></section><section class="card"><h2>② 觀察區間</h2><div class="grid"><div><label>剩餘比例下限 %</label><input id="low" type="number" min="0" max="100" value="8"></div><div><label>剩餘比例上限 %</label><input id="high" type="number" min="0" max="100" value="16"></div></div><p id="zone"></p></section><section class="card"><h2>③ 獎項提供比例</h2><div class="grid"><div><label>一等獎數量</label><input id="p1" type="number" min="0" value="3"></div><div><label>二等獎數量</label><input id="p2" type="number" min="0" value="43"></div><div><label>三等獎數量</label><input id="p3" type="number" min="0" value="69250"></div><div><label>四等獎數量</label><input id="p4" type="number" min="0" value="20704"></div></div><p id="prizes"></p></section><section class="card"><h2>④ 回報率與期望值</h2><div class="grid"><div class="stat">每抽公告理論回報<strong id="ev"></strong></div><div class="stat">每抽公告理論淨值<strong id="net"></strong></div></div><small>平台標示的點數回報率，不等於現金收益率或目前剩餘池的真實期望值。</small></section><section class="card"><h2>⑤ 一等獎機率情境</h2><div class="grid"><div class="stat">初始單抽機率<strong id="initial"></strong></div><div class="stat">假設全部仍在池內<strong id="hypo"></strong></div></div><p class="warn">無法得知目前一等獎剩餘數量時，不能推算實際即時中獎率；右側僅為假設情境。</p></section><section class="card"><h2>⑥ 綜合分析</h2><div class="stat"><div>卡池消耗進度</div><strong id="progress"></strong><div class="bar"><i id="fill"></i></div></div><pre id="report"></pre><button id="copy">複製報告</button><button id="save">儲存紀錄</button><button id="reset">恢復範例</button><label>歷史紀錄</label><select id="history"><option value="">選擇紀錄</option></select><button id="load">讀取紀錄</button></section><small>本工具僅作機率及公告數據整理；觀察區間不是中獎保證。紀錄僅存於此瀏覽器，清除網站資料可能遺失。</small></main><script>const ids=['name','total','remaining','cost','roi','low','high','p1','p2','p3','p4'];const el=id=>document.getElementById(id),n=id=>Number(el(id).value),fmt=x=>Number.isFinite(x)?x.toLocaleString('zh-TW',{maximumFractionDigits:4}):'—',pct=x=>Number.isFinite(x)?(x*100).toFixed(5)+'%':'—';function run(){let t=n('total'),r=n('remaining'),c=n('cost'),v=n('roi'),lo=n('low'),hi=n('high'),p=[1,2,3,4].map(i=>n('p'+i));let valid=t>0&&r>=0&&r<=t&&c>=0&&lo>=0&&hi<=100&&lo<=hi&&p.every(x=>x>=0&&Number.isInteger(x));if(!valid){el('report').textContent='輸入資料不合理，請檢查總抽數、剩餘抽數、區間及獎項數量。';return}let consumed=1-r/t,inside=r/t>=lo/100&&r/t<=hi/100,prizeSum=p.reduce((a,b)=>a+b,0);el('zone').textContent='觀察剩餘 '+fmt(t*hi/100)+'～'+fmt(t*lo/100)+' 抽；目前'+(inside?'位於':'不在')+'觀察區間';el('prizes').textContent=p.map((x,i)=>'第'+(i+1)+'等 '+fmt(x)+'（'+pct(x/t)+'）').join(' ｜ ')+'；總和 '+fmt(prizeSum)+(prizeSum===t?' ✓':' ⚠ 與總抽數不符');el('ev').textContent=fmt(c*v/100)+' 點';el('net').textContent=fmt(c*(v/100-1))+' 點';el('initial').textContent=pct(p[0]/t);el('hypo').textContent=r>0?pct(Math.min(p[0],r)/r):'無剩餘抽數';el('progress').textContent=pct(consumed);el('fill').style.width=(consumed*100)+'%';el('report').textContent=[el('name').value,'總抽數：'+fmt(t),'剩餘抽數：'+fmt(r),'已抽比例：'+pct(consumed),'觀察區間：剩餘 '+lo+'%～'+hi+'%（'+(inside?'區間內':'區間外')+'）','公告總回報率：'+v+'%','每抽公告理論回報：'+fmt(c*v/100)+' 點','每抽公告理論淨值：'+fmt(c*(v/100-1))+' 點','初始一等獎單抽機率：'+pct(p[0]/t),'即時一等獎機率：未知（未公開剩餘獎數）','注意：觀察區間不代表較高中獎率。'].join('\n')}ids.forEach(id=>el(id).addEventListener('input',run));const key='dopa-analyzer-history-v1';function records(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function refresh(){el('history').innerHTML='<option value="">選擇紀錄</option>';records().forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=x.date+' · '+x.values.name+' · 剩 '+x.values.remaining;el('history').append(o)})}el('save').onclick=()=>{let a=records(),values={};ids.forEach(id=>values[id]=el(id).value);a.unshift({date:new Date().toLocaleString('zh-TW'),values});localStorage.setItem(key,JSON.stringify(a.slice(0,50)));refresh();alert('已儲存於本機瀏覽器')};el('load').onclick=()=>{let x=records()[Number(el('history').value)];if(x){ids.forEach(id=>el(id).value=x.values[id]??'');run()}};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('report').textContent);alert('報告已複製')}catch{alert('請長按報告文字複製')}};el('reset').onclick=()=>{localStorage.removeItem('dopa-analyzer-current');location.reload()};refresh();run();</script></body></html>
